<title>Smart Campus Room Checker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: single centered column of three numbered fieldsets (requirements → room → time), result below. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1d2330; --muted: #5b6475; --line: #d9dde5;
  --accent: #2950c8; --accent-fg: #ffffff; --hover: #eef1f7;
  --ok-bg: #e3f6e8; --ok-fg: #145c2a; --err-bg: #fde8e8; --err-fg: #8a1c1c; --warn-bg: #fff4d6; --warn-fg: #7a5200;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1b2029; --fg: #e6e9ef; --muted: #9aa3b5; --line: #2d3442;
    --accent: #7f9cff; --accent-fg: #0f1320; --hover: #232a36;
    --ok-bg: #143322; --ok-fg: #9ee6b4; --err-bg: #3a1a1c; --err-fg: #ffb3b3; --warn-bg: #352a10; --warn-fg: #f4d27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1b2029; --fg: #e6e9ef; --muted: #9aa3b5; --line: #2d3442;
  --accent: #7f9cff; --accent-fg: #0f1320; --hover: #232a36;
  --ok-bg: #143322; --ok-fg: #9ee6b4; --err-bg: #3a1a1c; --err-fg: #ffb3b3; --warn-bg: #352a10; --warn-fg: #f4d27a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
main { max-width: 640px; margin: 0 auto; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 1.5rem; margin: 0 0 .25rem; text-wrap: balance; }
.now { color: var(--muted); margin-top: 0; }
fieldset { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 0 0 16px; padding: 12px 16px; min-width: 0; }
legend { font-weight: 600; padding: 0 4px; }
label { display: block; margin: 6px 0; }
input[type=number], input[type=date], input[type=time] { width: 100%; padding: 8px; font-size: 1rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.equipment { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.rooms { list-style: none; padding: 0; margin: 0; }
.room { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 6px; cursor: pointer; }
.room:hover { background: var(--hover); }
.room small { display: block; color: var(--muted); }
.room.blocked { opacity: .7; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.empty { color: var(--warn-fg); background: var(--warn-bg); padding: 10px; border-radius: 6px; }
button { width: 100%; padding: 12px; font-size: 1rem; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
.result { margin-top: 16px; padding: 12px; border-radius: 8px; }
.result:empty { display: none; }
.ok { background: var(--ok-bg); color: var(--ok-fg); }
.error { background: var(--err-bg); color: var(--err-fg); }

</style>

<main>
  <h1>Smart Campus Room Checker</h1>
  <p class="now">Current time (fixed): 10 Nov 2026, 09:00</p>
  <form id="form" novalidate>
    <fieldset>
      <legend>1. Requirements</legend>
      <label>Attendees <input id="attendees" type="number" min="1" inputmode="numeric" placeholder="e.g. 20"></label>
      <div class="equipment">
        <label><input type="checkbox" name="equipment" value="projector"> Projector</label>
        <label><input type="checkbox" name="equipment" value="whiteboard"> Whiteboard</label>
        <label><input type="checkbox" name="equipment" value="video-conf"> Video conferencing</label>
        <label><input type="checkbox" name="equipment" value="computers"> Computers</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>2. Choose a room</legend>
      <ul id="rooms" class="rooms"></ul>
      <p id="empty" class="empty" hidden>No rooms match these requirements. Try fewer attendees or less equipment.</p>
    </fieldset>
    <fieldset>
      <legend>3. Time slot</legend>
      <div class="row">
        <label>Date <input id="date" type="date" value="2026-11-10"></label>
        <label>Start <input id="start" type="time"></label>
        <label>End <input id="end" type="time"></label>
      </div>
    </fieldset>
    <button type="submit">Check availability</button>
  </form>
  <div id="result" class="result" role="status" aria-live="polite"></div>
</main>


<script>
(() => {
// ---- data/rooms.js ----
// Room catalog — fictional data only. Deep-frozen so no code path can mutate bookings (AC5).
const NOW = "2026-11-10T09:00"; // fixed current time

const EQUIPMENT = Object.freeze(["projector", "whiteboard", "video-conf", "computers"]);

const deepFreeze = (obj) => {
  Object.values(obj).forEach((v) => { if (v && typeof v === "object") deepFreeze(v); });
  return Object.freeze(obj);
};

const ROOMS = deepFreeze([
  {
    id: "R301", name: "Room 301", capacity: 30, blocked: false,
    equipment: ["projector", "whiteboard"],
    bookings: [
      { start: "2026-11-10T10:00", end: "2026-11-10T11:00", title: "Algorithms lecture" },
      { start: "2026-11-10T13:00", end: "2026-11-10T14:30", title: "Club meeting" }
    ]
  },
  {
    id: "R105", name: "Seminar Room 105", capacity: 12, blocked: false,
    equipment: ["whiteboard", "video-conf"],
    bookings: [
      { start: "2026-11-10T11:00", end: "2026-11-10T12:00", title: "Thesis defense rehearsal" }
    ]
  },
  {
    id: "LAB2", name: "Computer Lab 2", capacity: 24, blocked: false,
    equipment: ["projector", "computers", "whiteboard"],
    bookings: [
      { start: "2026-11-10T09:00", end: "2026-11-10T10:30", title: "Programming practice" }
    ]
  },
  {
    id: "AUD1", name: "Main Auditorium", capacity: 120, blocked: true,
    equipment: ["projector", "video-conf"],
    bookings: []
  },
  {
    id: "R210", name: "Study Room 210", capacity: 6, blocked: false,
    equipment: ["whiteboard"],
    bookings: []
  }
]);

const findRoom = (rooms, id) => rooms.find((r) => r.id === id) || null;

// ---- domain/time.js ----
// Single source of truth for time parsing (previously duplicated in 3 places).
const HHMM = /^([01]\d|2[0-3]):[0-5]\d$/;

const isValidHHMM = (value) => typeof value === "string" && HHMM.test(value);

/** Returns epoch ms for "YYYY-MM-DD" + "HH:MM", or NaN. */
const toMillis = (date, hhmm) => new Date(`${date}T${hhmm}`).getTime();

const minutesBetween = (startMs, endMs) => (endMs - startMs) / 60000;

/** Half-open intervals [aStart,aEnd) and [bStart,bEnd): touching is NOT overlap. */
const overlaps = (aStart, aEnd, bStart, bEnd) => aStart < bEnd && bStart < aEnd;

// ---- domain/availability.js ----
// Booking / availability rules AC1–AC4. Pure functions: no DOM, no mutation (AC5).

const MAX_MINUTES = 120;

const MESSAGES = Object.freeze({
  invalidTime: "Please enter a valid start and end time.",
  endBeforeStart: "End time must be after start time.",
  past: "Start time must be strictly after the current time.",
  tooLong: `Bookings cannot be longer than ${MAX_MINUTES} minutes.`,
  noRoom: "Please select a room first."
});

/** AC1 + AC2 (Assignment #03 wording): start strictly after now, end after start, max 120 min. */
function validateSlot({ date, start, end }, now) {
  if (!isValidHHMM(start) || !isValidHHMM(end)) return { ok: false, reason: "invalid", message: MESSAGES.invalidTime };
  const s = toMillis(date, start);
  const e = toMillis(date, end);
  if (Number.isNaN(s) || Number.isNaN(e)) return { ok: false, reason: "invalid", message: MESSAGES.invalidTime };
  if (e <= s) return { ok: false, reason: "order", message: MESSAGES.endBeforeStart };
  if (s <= new Date(now).getTime()) return { ok: false, reason: "past", message: MESSAGES.past }; // strictly after now
  if (minutesBetween(s, e) > MAX_MINUTES) return { ok: false, reason: "duration", message: MESSAGES.tooLong };
  return { ok: true, startMs: s, endMs: e };
}

/** AC1–AC4 for ONE room, using only that room's bookings. */
function checkAvailability(room, slot, now) {
  if (!room) return { ok: false, reason: "no-room", message: MESSAGES.noRoom };
  const v = validateSlot(slot, now);
  if (!v.ok) return v;
  if (room.blocked) return { ok: false, reason: "blocked", message: `${room.name} is blocked and cannot be booked.` };
  const conflict = room.bookings.find((b) =>
    overlaps(v.startMs, v.endMs, new Date(b.start).getTime(), new Date(b.end).getTime()));
  if (conflict) return { ok: false, reason: "conflict", message: `${room.name} conflicts with "${conflict.title}" (${conflict.start.slice(11)}–${conflict.end.slice(11)}).` };
  return { ok: true, reason: "available", message: `${room.name} is available.` };
}

// ---- domain/filters.js ----
// Room filtering rules F1–F3. Pure functions.

/** F1: capacity >= attendees. Empty/invalid attendees means "no capacity requirement". */
const meetsCapacity = (room, attendees) => {
  const n = Number(attendees);
  return !Number.isFinite(n) || n <= 0 || room.capacity >= n;
};

/** F2: room must contain ALL required items. */
const hasAllEquipment = (room, required = []) => required.every((item) => room.equipment.includes(item));

/**
 * Rooms matching the user's requirements. Blocked rooms stay in the list but are
 * flagged (F3: they can never be reported as available — see checkAvailability).
 */
function filterRooms(rooms, { attendees, equipment = [] } = {}) {
  return rooms.filter((r) => meetsCapacity(r, attendees) && hasAllEquipment(r, equipment));
}

// ---- ui/render.js ----
// UI presentation only: turns state into DOM. One renderResult() replaces the two copies in the baseline.

function renderRoomList(listEl, rooms, selectedId) {
  listEl.replaceChildren();
  for (const room of rooms) {
    const li = listEl.ownerDocument.createElement("li");
    const label = listEl.ownerDocument.createElement("label");
    label.className = "room" + (room.blocked ? " blocked" : "");
    const radio = listEl.ownerDocument.createElement("input");
    radio.type = "radio";
    radio.name = "room";
    radio.value = room.id;
    radio.checked = room.id === selectedId;
    const info = listEl.ownerDocument.createElement("span");
    info.innerHTML = `<strong></strong> <small></small>`;
    info.querySelector("strong").textContent = room.name;
    info.querySelector("small").textContent =
      `${room.capacity} seats · ${room.equipment.join(", ")}${room.blocked ? " · BLOCKED" : ""}`;
    label.append(radio, info);
    li.append(label);
    listEl.append(li);
  }
}

function renderEmptyState(emptyEl, isEmpty) {
  emptyEl.hidden = !isEmpty;
}

function renderResult(resultEl, result) {
  if (!result) {
    resultEl.className = "result";
    resultEl.textContent = "";
    return;
  }
  resultEl.className = `result ${result.ok ? "ok" : "error"}`;
  resultEl.dataset.reason = result.reason;
  resultEl.textContent = result.message;
}

// ---- ui/app.js ----
// UI controller: reads the form, calls domain functions, delegates drawing to render.js.




function mountApp(doc, { rooms = ROOMS, now = NOW } = {}) {
  const $ = (id) => doc.getElementById(id);
  const form = $("form"), list = $("rooms"), empty = $("empty"), result = $("result");
  const state = { selectedId: null, checked: false };

  const readCriteria = () => ({
    attendees: $("attendees").value,
    equipment: [...doc.querySelectorAll('input[name="equipment"]:checked')].map((c) => c.value)
  });
  const readSlot = () => ({ date: $("date").value, start: $("start").value, end: $("end").value });

  function refresh() {
    const visible = filterRooms(rooms, readCriteria());
    // selected room filtered out -> drop selection so we never show a stale result
    if (!visible.some((r) => r.id === state.selectedId)) state.selectedId = null;
    renderRoomList(list, visible, state.selectedId);
    renderEmptyState(empty, visible.length === 0);
    // F5: result always reflects the currently selected room
    if (!state.checked) return renderResult(result, null);
    const room = findRoom(rooms, state.selectedId);
    renderResult(result, checkAvailability(room, readSlot(), now));
  }

  list.addEventListener("change", (ev) => {
    if (ev.target.name === "room") { state.selectedId = ev.target.value; refresh(); }
  });
  form.addEventListener("input", (ev) => {
    if (ev.target.name !== "room") refresh(); // filters/time edits re-render immediately
  });
  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    state.checked = true;
    refresh();
  });

  refresh();
  return { state, refresh };
}

mountApp(document);
})();
</script>
