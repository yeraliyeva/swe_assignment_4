<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Checker (baseline)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 16px; }
  label { display: block; margin-top: .75rem; }
  input, button { width: 100%; padding: .5rem; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: 1rem; }
  .result { margin-top: 1rem; padding: .75rem; border-radius: 6px; }
  .ok { background: #e3f6e8; color: #145c2a; }
  .error { background: #fde8e8; color: #8a1c1c; }
</style>
</head>
<body>
  <h1>Is <span id="roomName"></span> free?</h1>
  <p>Current time (fixed): 10 Nov 2026, 09:00</p>
  <form id="form">
    <label>Date <input id="date" type="date" value="2026-11-10"></label>
    <label>Start <input id="start" type="time"></label>
    <label>End <input id="end" type="time"></label>
    <button type="submit">Check availability</button>
  </form>
  <div id="result" class="result" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
